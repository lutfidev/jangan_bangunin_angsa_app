name: jangan_bangunin_angsa_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled for google_fonts (filenames must match its API names, so don't
  # rename them). Runtime fetching is disabled in main().
  assets:
    - assets/google_fonts/
    - assets/levels/
